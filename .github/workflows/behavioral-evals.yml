name: Behavioral evals

on:
  workflow_dispatch:
    inputs:
      target_model:
        description: Target model id
        required: true
        type: string
      judge_model:
        description: Judge model id
        required: true
        type: string
      case_id:
        description: Optional single eval case id
        required: false
        default: premature-interface
        type: string
      context_mode:
        description: EngSense context loading mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - core
          - all
          - none
      fail_on_eval_failure:
        description: Fail workflow if the behavioral rubric fails
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  behavioral:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate fixtures and runner
        run: |
          python evals/validate.py
          python -m unittest discover -s evals/tests -p 'test_*.py'

      - name: Run behavioral evals
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is required for this manual workflow." >&2
            exit 2
          fi

          args=(
            --target-provider openai
            --target-model "${{ inputs.target_model }}"
            --judge-provider openai
            --judge-model "${{ inputs.judge_model }}"
            --context-mode "${{ inputs.context_mode }}"
          )

          if [ -n "${{ inputs.case_id }}" ]; then
            args+=(--case "${{ inputs.case_id }}")
          fi

          if [ "${{ inputs.fail_on_eval_failure }}" = "true" ]; then
            args+=(--fail-on-eval-failure)
          fi

          python evals/run_behavioral.py "${args[@]}"

      - name: Upload behavioral report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engsense-behavioral-eval
          path: evals/out/
          if-no-files-found: ignore
