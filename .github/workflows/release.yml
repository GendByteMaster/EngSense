name: Create GitHub Release

on:
  push:
    branches: [main]
    paths: ['docs/releases/v0.1.0-preview.request']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag matching package.json'
        required: true
        default: 'v0.1.0'
      expected_sha:
        description: 'Exact reviewed main commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: engsense-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TAG: ${{ github.event_name == 'push' && 'v0.1.0' || inputs.tag }}
      EXPECTED_SHA: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release artifact and review gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$TAG" = "v$(node -p "require('./package.json').version")"
          test "$TAG" = "v0.1.0"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$(cat docs/releases/v0.1.0-preview.request)" = 'v0.1.0 development prerelease; live behavior NOT RUN; packaged installer'
            echo 'Development prerelease explicitly requested; live behavior not verified.'
          else
            python evals/validate_release_review.py
          fi
          python evals/validate.py
          python evals/validate_skill.py
          npm test
          npm pack --dry-run
          mkdir -p "$RUNNER_TEMP/engsense-release"
          npm pack --pack-destination "$RUNNER_TEMP/engsense-release"
      - name: Verify main CI on exact revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in evals.yml skill-static-integrity.yml skill-install-smoke.yml; do
            result=''
            for attempt in $(seq 1 30); do
              result=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --branch main --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')
              if [ "$result" = success ]; then break; fi
              if [ -n "$result" ]; then echo "Unsuccessful main check: $workflow ($result)"; exit 1; fi
              sleep 10
            done
            test "$result" = success || { echo "Missing successful main check: $workflow"; exit 1; }
          done
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing replacement"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists; refusing replacement"; exit 1
          else
            code=$?
            test "$code" = 2 || exit "$code"
          fi
          flags=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then flags+=(--prerelease); fi
          artifact="$RUNNER_TEMP/engsense-release/gendbytemaster-engsense-${TAG#v}.tgz"
          test -f "$artifact"
          gh release create "$TAG" "$artifact" --target "$GITHUB_SHA" --title "EngSense $TAG — Engineering Judgment Skill" --notes-file docs/RELEASE_NOTES_v0.1.0.md "${flags[@]}"
