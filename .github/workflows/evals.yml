name: Eval fixture validation

on:
  push:
    paths:
      - "evals/**"
      - ".github/workflows/evals.yml"
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/evals.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate EngSense eval cases
        run: python evals/validate.py

      - name: Test behavioral eval runner
        run: python -m unittest discover -s evals/tests -p 'test_*.py'
