name: Skill install smoke

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "assets/**"
      - "scripts/**"
      - "decision-framework.md"
      - "review-workflow.md"
      - "principles/**"
      - "languages/**"
      - "domains/**"
      - "references/**"
      - "docs/INSTALLATION.md"
      - ".github/workflows/skill-install-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "agents/**"
      - "assets/**"
      - "scripts/**"
      - "decision-framework.md"
      - "review-workflow.md"
      - "principles/**"
      - "languages/**"
      - "domains/**"
      - "references/**"
      - "docs/INSTALLATION.md"
      - ".github/workflows/skill-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up clean test repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/engsense-smoke"
          mkdir -p "$RUNNER_TEMP/engsense-smoke"
          cd "$RUNNER_TEMP/engsense-smoke"
          git init -q

      - name: Install EngSense with npx
        shell: bash
        working-directory: ${{ runner.temp }}/engsense-smoke
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SOURCE="$GITHUB_WORKSPACE"
          else
            SOURCE="https://github.com/GendByteMaster/EngSense"
          fi

          npx --yes skills add "$SOURCE" -a codex -y

      - name: Verify install and AGENTS registration
        shell: bash
        working-directory: ${{ runner.temp }}/engsense-smoke
        run: |
          set -euo pipefail

          test -f .agents/skills/engsense/SKILL.md
          test -f .agents/skills/engsense/decision-framework.md
          test -f .agents/skills/engsense/review-workflow.md
          test -f .agents/skills/engsense/agents/openai.yaml
          test -f .agents/skills/engsense/principles/performance-engineering.md
          test -f .agents/skills/engsense/languages/rust.md
          test -f .agents/skills/engsense/domains/distributed-systems.md
          test -f .agents/skills/engsense/domains/domain-modeling.md
          test -f .agents/skills/engsense/references/routing-map.md
          test -f .agents/skills/engsense/assets/agents-snippet.md
          test -f .agents/skills/engsense/scripts/sync_agents.py

          grep -Fqx "name: engsense" .agents/skills/engsense/SKILL.md

          printf '%s\n\n%s\n' "# Existing project rule" "Preserve this line." > AGENTS.md

          python .agents/skills/engsense/scripts/sync_agents.py
          python .agents/skills/engsense/scripts/sync_agents.py --check

          grep -Fqx "# Existing project rule" AGENTS.md
          grep -Fqx "Preserve this line." AGENTS.md
          test "$(grep -Fc "<!-- engsense:begin -->" AGENTS.md)" -eq 1
          test "$(grep -Fc "<!-- engsense:end -->" AGENTS.md)" -eq 1

          before="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          python .agents/skills/engsense/scripts/sync_agents.py
          after="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          test "$before" = "$after"

          echo "EngSense Skill install + AGENTS.md registration smoke test passed."
