name: Skill install smoke

on:
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "bin/**"
      - "package.json"
      - "decision-framework.md"
      - "review-workflow.md"
      - "principles/**"
      - "languages/**"
      - "domains/**"
      - "references/**"
      - "docs/INSTALLATION.md"
      - ".github/workflows/skill-install-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "agents/**"
      - "bin/**"
      - "package.json"
      - "decision-framework.md"
      - "review-workflow.md"
      - "principles/**"
      - "languages/**"
      - "domains/**"
      - "references/**"
      - "docs/INSTALLATION.md"
      - ".github/workflows/skill-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up clean test repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/engsense-smoke"
          mkdir -p "$RUNNER_TEMP/engsense-smoke"
          cd "$RUNNER_TEMP/engsense-smoke"
          git init -q
          printf '%s\n\n%s\n' "# Existing project rule" "Preserve this line." > AGENTS.md

      - name: Install EngSense
        shell: bash
        working-directory: ${{ runner.temp }}/engsense-smoke
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node "$GITHUB_WORKSPACE/bin/engsense.js" install --client codex
          else
            npx --yes github:GendByteMaster/EngSense install --client codex
          fi

      - name: Verify Skill and AGENTS integration
        shell: bash
        working-directory: ${{ runner.temp }}/engsense-smoke
        run: |
          set -euo pipefail

          test -f .agents/skills/engsense/SKILL.md
          test -f .agents/skills/engsense/decision-framework.md
          test -f .agents/skills/engsense/review-workflow.md
          test -f .agents/skills/engsense/agents/openai.yaml
          test -f .agents/skills/engsense/principles/performance-engineering.md
          test -f .agents/skills/engsense/languages/rust.md
          test -f .agents/skills/engsense/domains/distributed-systems.md
          test -f .agents/skills/engsense/domains/domain-modeling.md
          test -f .agents/skills/engsense/references/routing-map.md

          grep -Fqx "name: engsense" .agents/skills/engsense/SKILL.md
          grep -Fqx "# Existing project rule" AGENTS.md
          grep -Fqx "Preserve this line." AGENTS.md
          test "$(grep -Fc "<!-- engsense:managed-start -->" AGENTS.md)" -eq 1
          test "$(grep -Fc "<!-- engsense:managed-end -->" AGENTS.md)" -eq 1

          before="$(sha256sum AGENTS.md | cut -d' ' -f1)"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node "$GITHUB_WORKSPACE/bin/engsense.js" install --client codex
            node "$GITHUB_WORKSPACE/bin/engsense.js" status --client codex
          else
            npx --yes github:GendByteMaster/EngSense install --client codex
            npx --yes github:GendByteMaster/EngSense status --client codex
          fi

          after="$(sha256sum AGENTS.md | cut -d' ' -f1)"
          test "$before" = "$after"

      - name: Verify uninstall preserves user AGENTS content
        shell: bash
        working-directory: ${{ runner.temp }}/engsense-smoke
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node "$GITHUB_WORKSPACE/bin/engsense.js" uninstall --client codex
          else
            npx --yes github:GendByteMaster/EngSense uninstall --client codex
          fi

          test ! -e .agents/skills/engsense
          grep -Fqx "# Existing project rule" AGENTS.md
          grep -Fqx "Preserve this line." AGENTS.md
          ! grep -Fq "<!-- engsense:managed-start -->" AGENTS.md
          ! grep -Fq "<!-- engsense:managed-end -->" AGENTS.md

          echo "EngSense ForgeGuard-style install/status/uninstall smoke test passed."
